[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geometric-deep-learning-thesis"
version = "0.2.0"
description = "Controlled empirical investigation of rotational equivariance"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "torch>=2.2,<3", "torchvision>=0.17,<1", "numpy==1.26.4",
  "escnn==1.0.11", "PyYAML>=6,<7", "scipy>=1.11,<2",
  "matplotlib==3.10.8", "contourpy==1.3.2", "python-dateutil==2.9.0.post0",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
medical = ["medmnist==3.0.2", "pandas==2.2.3", "scikit-image==0.24.0", "scikit-learn==1.6.1", "tifffile==2024.9.20"]

[tool.setuptools.packages.find]
include = ["src*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
